[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-masters-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wfdb",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8"
]

app = [
    "fastapi",
    "uvicorn[standard]",
]

ipynb = [
    "ipykernel>=7.4.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.ruff]
src = ["src", "."]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
mypy_path = ["src", "."]
strict = true

[[tool.mypy.overrides]]
module = ["wfdb.*"]
ignore_missing_imports = true